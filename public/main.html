   <main class="content">
  <h1>Product Manager</h1>

  <form id="productForm" style="margin-top:20px;">
    <input type="text" id="name" placeholder="Product Name" required /><br><br>

    <input type="number" id="price" placeholder="Price" required /><br><br>

    <input type="text" id="category" placeholder="Category" /><br><br>

    <input type="text" id="image" placeholder="Image URL" /><br><br>

    <input type="number" id="stock" placeholder="Stock" /><br><br>

    <textarea id="description" placeholder="Description"></textarea><br><br>

    <button type="submit">Add Product</button>
  </form>

  <hr style="margin:30px 0">

  <h2>All Products</h2>
  <div id="productList"></div>
